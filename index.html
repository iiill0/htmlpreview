<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>HTML 미리보기</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=JetBrains+Mono:wght@400;500&display=swap');

  :root {
    --cream-bg:    #F7F3EC;
    --cream-light: #FBF8F3;
    --cream-dark:  #EDE8DE;
    --cream-border:#DDD8CE;
    --cream-mid:   #C9C3B6;
    --brown-soft:  #8C7E6A;
    --brown-dark:  #4A3F32;
    --brown-btn:   #6B5A47;
    --brown-hover: #584A3A;
    --accent:      #B5935A;
    --accent-light:#F0E6D4;
    --text-main:   #2E2620;
    --text-sub:    #7A6E63;
    --text-hint:   #A89E94;
    --white:       #FFFFFF;
    --radius-sm:   6px;
    --radius-md:   10px;
    --radius-lg:   14px;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: 'Inter', sans-serif;
    background: var(--cream-bg);
    color: var(--text-main);
    height: 100vh;
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }

  /* ── 상단 헤더 ── */
  header {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 0 20px;
    height: 52px;
    background: var(--cream-light);
    border-bottom: 1px solid var(--cream-border);
    flex-shrink: 0;
  }

  .logo {
    display: flex;
    align-items: center;
    gap: 8px;
    font-size: 14px;
    font-weight: 600;
    color: var(--brown-dark);
    letter-spacing: -0.01em;
  }
  .logo-icon {
    width: 28px; height: 28px;
    background: var(--brown-btn);
    border-radius: 7px;
    display: flex; align-items: center; justify-content: center;
    color: var(--cream-light);
    font-size: 14px;
  }

  .spacer { flex: 1; }

  .toolbar-btns { display: flex; gap: 8px; }

  .btn {
    display: inline-flex; align-items: center; gap: 5px;
    padding: 6px 13px;
    border-radius: var(--radius-sm);
    font-size: 12.5px; font-weight: 500;
    font-family: 'Inter', sans-serif;
    cursor: pointer; border: none;
    transition: all 0.15s;
  }
  .btn-ghost {
    background: transparent;
    color: var(--brown-soft);
    border: 1px solid var(--cream-border);
  }
  .btn-ghost:hover { background: var(--cream-dark); color: var(--brown-dark); }

  .btn-clear {
    background: transparent;
    color: var(--text-hint);
    border: 1px solid var(--cream-border);
  }
  .btn-clear:hover { background: #f5ece4; color: #b05a3a; border-color: #e0c0a8; }

  .btn-capture {
    background: var(--brown-btn);
    color: var(--cream-light);
    border: 1px solid transparent;
    padding: 6px 16px;
  }
  .btn-capture:hover { background: var(--brown-hover); }
  .btn-capture:active { transform: scale(0.97); }

  /* ── 메인 레이아웃 ── */
  .main {
    display: flex;
    flex: 1;
    min-height: 0;
  }

  /* ── 에디터 패널 (좁게) ── */
  .editor-panel {
    display: flex;
    flex-direction: column;
    width: 340px;
    flex-shrink: 0;
    border-right: 1px solid var(--cream-border);
    background: var(--cream-light);
  }

  .panel-header {
    display: flex; align-items: center; justify-content: space-between;
    padding: 8px 14px;
    border-bottom: 1px solid var(--cream-border);
    background: var(--cream-bg);
  }
  .panel-label {
    font-size: 10.5px; font-weight: 600;
    color: var(--text-hint);
    letter-spacing: 0.07em; text-transform: uppercase;
  }
  .line-count {
    font-size: 11px; color: var(--text-hint);
    font-family: 'JetBrains Mono', monospace;
  }

  textarea {
    flex: 1;
    width: 100%; resize: none;
    border: none; outline: none;
    padding: 16px 14px;
    font-size: 12.5px; line-height: 1.7;
    font-family: 'JetBrains Mono', monospace;
    background: var(--cream-light);
    color: var(--text-main);
    caret-color: var(--accent);
    tab-size: 2;
  }
  textarea::placeholder { color: var(--text-hint); font-size: 12px; }
  textarea:focus { background: var(--white); }

  /* 드래그 핸들 */
  .resize-handle {
    width: 5px;
    background: var(--cream-border);
    cursor: col-resize;
    flex-shrink: 0;
    transition: background 0.15s;
    position: relative;
  }
  .resize-handle:hover { background: var(--accent); }
  .resize-handle::after {
    content: '';
    position: absolute;
    top: 50%; left: 50%;
    transform: translate(-50%, -50%);
    width: 1px; height: 40px;
    background: inherit;
    border-radius: 2px;
  }

  /* ── 미리보기 패널 (넓게) ── */
  .preview-panel {
    display: flex;
    flex-direction: column;
    flex: 1;
    min-width: 0;
    background: var(--cream-bg);
  }

  .preview-status {
    font-size: 11px; color: var(--text-hint);
    font-family: 'JetBrains Mono', monospace;
  }

  /* iframe 영역 */
  .preview-body {
    flex: 1; min-height: 0; position: relative;
    background: #fff;
    margin: 12px;
    border-radius: var(--radius-md);
    overflow: hidden;
    border: 1px solid var(--cream-border);
    box-shadow: 0 2px 12px rgba(74,63,50,0.06);
  }

  iframe {
    width: 100%; height: 100%;
    border: none; display: block;
  }

  /* 빈 상태 */
  .empty-state {
    position: absolute; inset: 0;
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    gap: 10px;
    background: var(--cream-light);
    pointer-events: none;
  }
  .empty-icon { font-size: 36px; opacity: 0.3; }
  .empty-text { font-size: 13px; color: var(--text-hint); }

  /* 캡처 성공 토스트 */
  .toast {
    position: fixed;
    bottom: 28px; left: 50%;
    transform: translateX(-50%) translateY(20px);
    background: var(--brown-dark);
    color: var(--cream-light);
    padding: 10px 22px;
    border-radius: 30px;
    font-size: 13px; font-weight: 500;
    opacity: 0;
    transition: all 0.25s ease;
    pointer-events: none;
    z-index: 100;
    white-space: nowrap;
  }
  .toast.show {
    opacity: 1;
    transform: translateX(-50%) translateY(0);
  }
</style>
</head>
<body>

<header>
  <div class="logo">
    <div class="logo-icon">&#60;/&#62;</div>
    HTML 미리보기
  </div>
  <div class="spacer"></div>
  <div class="toolbar-btns">
    <button class="btn btn-clear" id="clearBtn">초기화</button>
    <button class="btn btn-capture" id="captureBtn">📷 캡처 저장</button>
  </div>
</header>

<div class="main">
  <!-- 에디터 -->
  <div class="editor-panel" id="editorPanel">
    <div class="panel-header">
      <span class="panel-label">코드 편집</span>
      <span class="line-count" id="lineCount">0줄</span>
    </div>
    <textarea id="codeEditor" placeholder="여기에 HTML 코드를 입력하세요...&#10;&#10;예)&#10;&lt;h1&gt;안녕하세요&lt;/h1&gt;&#10;&lt;p&gt;HTML 미리보기 도구입니다.&lt;/p&gt;" spellcheck="false"></textarea>
  </div>

  <!-- 드래그 핸들 -->
  <div class="resize-handle" id="resizeHandle"></div>

  <!-- 미리보기 -->
  <div class="preview-panel">
    <div class="preview-body" id="previewBody">
      <div class="empty-state" id="emptyState">
        <div class="empty-icon">⌨️</div>
        <div class="empty-text">왼쪽에 HTML 코드를 입력하면 여기에 표시됩니다</div>
      </div>
      <iframe id="previewFrame" sandbox="allow-scripts allow-same-origin" style="display:none;"></iframe>
    </div>
  </div>
</div>

<div class="toast" id="toast">✓ 이미지로 저장되었습니다</div>

<script>
const editor    = document.getElementById('codeEditor');
const frame     = document.getElementById('previewFrame');
const lineCount = document.getElementById('lineCount');
const emptyState= document.getElementById('emptyState');
const toast     = document.getElementById('toast');

let timer;

function updatePreview() {
  const code = editor.value.trim();
  const lines = editor.value ? editor.value.split('\n').length : 0;
  lineCount.textContent = lines + '줄';

  clearTimeout(timer);
  timer = setTimeout(() => {
    if (!code) {
      frame.style.display = 'none';
      emptyState.style.display = 'flex';
      return;
    }
    const doc = frame.contentDocument || frame.contentWindow.document;
    doc.open(); doc.write(code); doc.close();
    frame.style.display = 'block';
    emptyState.style.display = 'none';

  }, 280);
}

editor.addEventListener('input', updatePreview);

editor.addEventListener('keydown', e => {
  if (e.key === 'Tab') {
    e.preventDefault();
    const s = editor.selectionStart, end = editor.selectionEnd;
    editor.value = editor.value.slice(0, s) + '  ' + editor.value.slice(end);
    editor.selectionStart = editor.selectionEnd = s + 2;
    updatePreview();
  }
});

document.getElementById('clearBtn').addEventListener('click', () => {
  editor.value = '';
  updatePreview();
  editor.focus();
});

document.getElementById('captureBtn').addEventListener('click', async () => {
  if (!editor.value.trim()) { showToast('먼저 HTML 코드를 입력하세요'); return; }
  try {
    const iframeDoc = frame.contentDocument || frame.contentWindow.document;
    const iframeBody = iframeDoc.body;
    const iframeHtml = iframeDoc.documentElement;

    // 실제 콘텐츠 크기 측정
    const contentW = Math.max(iframeBody.scrollWidth, iframeHtml.scrollWidth);
    const contentH = Math.max(iframeBody.scrollHeight, iframeHtml.scrollHeight);

    // iframe을 콘텐츠 크기에 맞게 임시 확장
    const origW = frame.style.width;
    const origH = frame.style.height;
    frame.style.width  = contentW + 'px';
    frame.style.height = contentH + 'px';

    // 배경색 가져오기 (없으면 흰색)
    const bgColor = window.getComputedStyle(iframeBody).backgroundColor || '#ffffff';

    const canvas = await html2canvas(iframeBody, {
      useCORS: true,
      allowTaint: true,
      backgroundColor: bgColor === 'rgba(0, 0, 0, 0)' ? '#ffffff' : bgColor,
      scale: 2,
      width: contentW,
      height: contentH,
      windowWidth: contentW,
      windowHeight: contentH,
      scrollX: 0,
      scrollY: 0
    });

    // iframe 원래 크기로 복원
    frame.style.width  = origW;
    frame.style.height = origH;

    const a = document.createElement('a');
    const ts = new Date().toISOString().slice(0,19).replace(/[T:]/g,'-');
    a.download = 'preview-' + ts + '.png';
    a.href = canvas.toDataURL('image/png');
    a.click();
    showToast('✓ 이미지로 저장되었습니다');
  } catch(e) {
    showToast('캡처 중 오류가 발생했습니다');
  }
});

function showToast(msg) {
  toast.textContent = msg;
  toast.classList.add('show');
  setTimeout(() => toast.classList.remove('show'), 2200);
}

/* ── 드래그로 패널 크기 조절 ── */
const handle = document.getElementById('resizeHandle');
const editorPanel = document.getElementById('editorPanel');
let dragging = false, startX, startW;

handle.addEventListener('mousedown', e => {
  dragging = true; startX = e.clientX; startW = editorPanel.offsetWidth;
  document.body.style.cursor = 'col-resize';
  document.body.style.userSelect = 'none';
  e.preventDefault();
});
document.addEventListener('mousemove', e => {
  if (!dragging) return;
  const w = Math.max(200, Math.min(700, startW + (e.clientX - startX)));
  editorPanel.style.width = w + 'px';
});
document.addEventListener('mouseup', () => {
  dragging = false;
  document.body.style.cursor = '';
  document.body.style.userSelect = '';
});
</script>
</body>
</html>
