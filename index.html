<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>HTML 미리보기</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html-to-image/1.11.11/html-to-image.min.js"></script>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=JetBrains+Mono:wght@400;500&display=swap');

  :root {
    --cream-bg:    #F7F3EC;
    --cream-light: #FBF8F3;
    --cream-border:#DDD8CE;
    --brown-dark:  #4A3F32;
    --brown-btn:   #6B5A47;
    --brown-hover: #584A3A;
    --accent:      #B5935A;
    --text-main:   #2E2620;
    --text-hint:   #A89E94;
    --radius-sm:   6px;
    --radius-md:   10px;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: 'Inter', sans-serif;
    background: var(--cream-bg);
    color: var(--text-main);
    height: 100dvh;
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }

  header {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 0 16px;
    height: 50px;
    background: var(--cream-light);
    border-bottom: 1px solid var(--cream-border);
    flex-shrink: 0;
  }
  .logo {
    display: flex;
    align-items: center;
    gap: 8px;
    font-size: 14px;
    font-weight: 600;
    color: var(--brown-dark);
    white-space: nowrap;
  }
  .logo-icon {
    width: 28px; height: 28px;
    background: var(--brown-btn);
    border-radius: 7px;
    display: flex; align-items: center; justify-content: center;
    color: #FBF8F3;
    font-size: 13px;
    flex-shrink: 0;
  }
  .spacer { flex: 1; }

  .btn {
    display: inline-flex; align-items: center; gap: 5px;
    padding: 6px 14px;
    border-radius: var(--radius-sm);
    font-size: 12.5px; font-weight: 500;
    font-family: 'Inter', sans-serif;
    cursor: pointer; border: none;
    transition: all 0.15s;
    white-space: nowrap;
  }
  .btn-clear {
    background: transparent;
    color: var(--text-hint);
    border: 1px solid var(--cream-border);
  }
  .btn-clear:hover { background: #f5ece4; color: #b05a3a; }
  .btn-capture {
    background: var(--brown-btn);
    color: #FBF8F3;
  }
  .btn-capture:hover { background: var(--brown-hover); }
  .btn-capture:disabled { opacity: 0.5; cursor: not-allowed; }

  .tab-bar {
    display: none;
    background: var(--cream-light);
    border-bottom: 1px solid var(--cream-border);
    flex-shrink: 0;
  }
  .tab-bar-inner { display: flex; }
  .tab-btn {
    flex: 1; padding: 10px 0;
    background: none; border: none;
    border-bottom: 2px solid transparent;
    font-family: 'Inter', sans-serif;
    font-size: 13px; font-weight: 500;
    color: var(--text-hint);
    cursor: pointer; transition: all 0.15s;
  }
  .tab-btn.active { color: var(--brown-btn); border-bottom-color: var(--brown-btn); }

  .main { display: flex; flex: 1; min-height: 0; }

  .editor-panel {
    display: flex; flex-direction: column;
    width: 260px; flex-shrink: 0;
    border-right: 1px solid var(--cream-border);
    background: var(--cream-light);
  }
  .panel-header {
    display: flex; align-items: center; justify-content: space-between;
    padding: 7px 12px;
    border-bottom: 1px solid var(--cream-border);
    background: var(--cream-bg);
    flex-shrink: 0;
  }
  .panel-label {
    font-size: 10px; font-weight: 600;
    color: var(--text-hint);
    letter-spacing: 0.07em; text-transform: uppercase;
  }
  .line-count { font-size: 11px; color: var(--text-hint); font-family: 'JetBrains Mono', monospace; }

  textarea {
    flex: 1; width: 100%; resize: none;
    border: none; outline: none;
    padding: 14px 12px;
    font-size: 12px; line-height: 1.7;
    font-family: 'JetBrains Mono', monospace;
    background: var(--cream-light);
    color: var(--text-main);
    tab-size: 2;
  }
  textarea:focus { background: #fff; }
  textarea::placeholder { color: var(--text-hint); }

  .resize-handle {
    width: 4px; flex-shrink: 0;
    background: var(--cream-border);
    cursor: col-resize;
    transition: background 0.15s;
  }
  .resize-handle:hover { background: var(--accent); }

  .preview-panel {
    display: flex; flex-direction: column;
    flex: 1; min-width: 0;
    background: #fff;
  }

  .preview-body {
    flex: 1; min-height: 0;
    background: #fff;
    overflow-y: auto;
    position: relative;
  }

  #previewFrame {
    display: none;
    width: 100%;
    border: none;
    background: transparent;
  }

  .empty-state {
    position: absolute; inset: 0;
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    gap: 10px;
    background: var(--cream-light);
    pointer-events: none;
  }
  .empty-icon { font-size: 34px; opacity: 0.3; }
  .empty-text { font-size: 13px; color: var(--text-hint); }

  .toast {
    position: fixed; bottom: 28px; left: 50%;
    transform: translateX(-50%) translateY(20px);
    background: var(--brown-dark); color: #FBF8F3;
    padding: 10px 22px; border-radius: 30px;
    font-size: 13px; font-weight: 500;
    opacity: 0; transition: all 0.25s ease;
    pointer-events: none; z-index: 100;
    white-space: nowrap;
  }
  .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

  @media (max-width: 768px) {
    .tab-bar { display: block; }
    .resize-handle { display: none; }
    .main { flex-direction: column; }
    .editor-panel {
      width: 100%; border-right: none;
      flex: 1; min-height: 0; display: none;
    }
    .editor-panel.tab-active { display: flex; }
    .preview-panel { flex: 1; min-height: 0; display: none; }
    .preview-panel.tab-active { display: flex; }

    .panel-header { display: none; }
    .btn { padding: 5px 10px; font-size: 12px; }
  }
</style>
</head>
<body>

<header>
  <div class="logo">
    <div class="logo-icon">&#60;/&#62;</div>
    HTML 미리보기
  </div>
  <div class="spacer"></div>
  <button class="btn btn-clear" id="clearBtn">초기화</button>
  <button class="btn btn-capture" id="captureBtn">📷 캡처</button>
</header>

<div class="tab-bar">
  <div class="tab-bar-inner">
    <button class="tab-btn active" id="tabCode" onclick="switchTab('code')">✏️ 코드</button>
    <button class="tab-btn" id="tabPreview" onclick="switchTab('preview')">👁 미리보기</button>
  </div>
</div>

<div class="main">
  <div class="editor-panel tab-active" id="editorPanel">
    <div class="panel-header">
      <span class="panel-label">코드 편집</span>
      <span class="line-count" id="lineCount">0줄</span>
    </div>
    <textarea id="codeEditor" placeholder="여기에 HTML 코드를 입력하세요..." spellcheck="false"></textarea>
  </div>

  <div class="resize-handle" id="resizeHandle"></div>

  <div class="preview-panel tab-active" id="previewPanel">
    <div class="preview-body" id="previewBody">
      <div class="empty-state" id="emptyState">
        <div class="empty-icon">⌨️</div>
        <div class="empty-text">HTML 코드를 입력하면 여기에 표시됩니다</div>
      </div>
      <iframe id="previewFrame" sandbox="allow-scripts allow-same-origin allow-modals"></iframe>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
const editor      = document.getElementById('codeEditor');
const frame       = document.getElementById('previewFrame');
const lineCount   = document.getElementById('lineCount');
const emptyState  = document.getElementById('emptyState');
const captureBtn  = document.getElementById('captureBtn');
const toast       = document.getElementById('toast');

let timer;
let currentCode = '';

function fitIframeHeight() {
  try {
    const iDoc = frame.contentDocument || frame.contentWindow.document;
    if (!iDoc || !iDoc.body) return;
    const h = Math.max(iDoc.body.scrollHeight, iDoc.documentElement.scrollHeight);
    if (h > 0) frame.style.height = h + 'px';
  } catch(e) {}
}

function updatePreview() {
  currentCode = editor.value.trim();
  lineCount.textContent = (editor.value ? editor.value.split('\n').length : 0) + '줄';
  clearTimeout(timer);
  timer = setTimeout(() => {
    if (!currentCode) {
      frame.style.display = 'none';
      emptyState.style.display = 'flex';
      return;
    }
    const doc = frame.contentDocument || frame.contentWindow.document;
    doc.open();
    doc.write(currentCode);
    doc.close();
    frame.style.display = 'block';
    emptyState.style.display = 'none';
    setTimeout(fitIframeHeight, 150);
  }, 300);
}

editor.addEventListener('input', updatePreview);
editor.addEventListener('keydown', e => {
  if (e.key === 'Tab') {
    e.preventDefault();
    const s = editor.selectionStart;
    editor.value = editor.value.slice(0, s) + '  ' + editor.value.slice(editor.selectionEnd);
    editor.selectionStart = editor.selectionEnd = s + 2;
    updatePreview();
  }
});

document.getElementById('clearBtn').addEventListener('click', () => {
  editor.value = '';
  currentCode = '';
  frame.style.display = 'none';
  emptyState.style.display = 'flex';
  lineCount.textContent = '0줄';
  if (window.innerWidth <= 768) switchTab('code');
  editor.focus();
});

function switchTab(tab) {
  const ep = document.getElementById('editorPanel');
  const pp = document.getElementById('previewPanel');
  const tc = document.getElementById('tabCode');
  const tp = document.getElementById('tabPreview');
  if (tab === 'code') {
    ep.classList.add('tab-active'); pp.classList.remove('tab-active');
    tc.classList.add('active');     tp.classList.remove('active');
    setTimeout(() => editor.focus(), 50);
  } else {
    pp.classList.add('tab-active'); ep.classList.remove('tab-active');
    tp.classList.add('active');     tc.classList.remove('active');
    setTimeout(fitIframeHeight, 50);
  }
}

// ── 캡처: 원래 문서의 배경색을 추출해서 적용하는 로직 추가 ──
captureBtn.addEventListener('click', async () => {
  if (!currentCode) { showToast('먼저 HTML 코드를 입력하세요'); return; }
  
  captureBtn.disabled = true;
  captureBtn.textContent = '캡처 중...';

  try {
    const iDoc = frame.contentDocument || frame.contentWindow.document;
    const body = iDoc.body;
    
    // 폰트 완전 로딩 대기
    if (iDoc.fonts && iDoc.fonts.ready) {
      await iDoc.fonts.ready;
    }

    // 1. 캡처할 요소 타겟팅 (여백 없애기용)
    const validChildren = Array.from(body.children).filter(el => !['SCRIPT', 'STYLE'].includes(el.tagName));
    const targetElement = (validChildren.length === 1) ? validChildren[0] : body;

    // 2. 사용자가 HTML에 지정한 진짜 배경색(body 배경색) 가져오기
    let originalBgColor = window.getComputedStyle(body).backgroundColor;
    
    // 만약 배경색을 아예 지정 안 했다면 기본값인 흰색으로 처리
    if (originalBgColor === 'rgba(0, 0, 0, 0)' || originalBgColor === 'transparent') {
      originalBgColor = '#ffffff';
    }

    // 3. 캡처 실행 (추출한 원래 배경색을 그대로 적용!)
    const dataUrl = await htmlToImage.toPng(targetElement, {
      pixelRatio: 2, 
      backgroundColor: originalBgColor, // 👈 여기에 원래 색상을 넣습니다!
      style: {
        margin: '0' 
      }
    });

    const a = document.createElement('a');
    const ts = new Date().toISOString().slice(0, 19).replace(/[T:]/g, '-');
    a.download = 'preview-' + ts + '.png';
    a.href = dataUrl;
    a.click();
    showToast('✓ 저장되었습니다');

  } catch (err) {
    showToast('캡처 실패: ' + err.message);
  } finally {
    captureBtn.disabled = false;
    captureBtn.textContent = '📷 캡처';
  }
});

function showToast(msg) {
  toast.textContent = msg;
  toast.classList.add('show');
  setTimeout(() => toast.classList.remove('show'), 2400);
}

const handle = document.getElementById('resizeHandle');
const editorPanel = document.getElementById('editorPanel');
let drag = false, startX, startW;
handle.addEventListener('mousedown', e => {
  drag = true; startX = e.clientX; startW = editorPanel.offsetWidth;
  document.body.style.cursor = 'col-resize';
  document.body.style.userSelect = 'none';
  e.preventDefault();
});
document.addEventListener('mousemove', e => {
  if (!drag) return;
  editorPanel.style.width = Math.max(160, Math.min(600, startW + e.clientX - startX)) + 'px';
});
document.addEventListener('mouseup', () => {
  drag = false;
  document.body.style.cursor = '';
  document.body.style.userSelect = '';
});

window.addEventListener('resize', () => {
  if (window.innerWidth > 768) {
    document.getElementById('editorPanel').classList.add('tab-active');
    document.getElementById('previewPanel').classList.add('tab-active');
  }
});
</script>
</body>
</html>
