<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>HTML 미리보기 v7</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=JetBrains+Mono:wght@400;500&display=swap');

  :root {
    --cream-bg:    #F7F3EC;
    --cream-light: #FBF8F3;
    --cream-dark:  #EDE8DE;
    --cream-border:#DDD8CE;
    --brown-dark:  #4A3F32;
    --brown-btn:   #6B5A47;
    --brown-hover: #584A3A;
    --accent:      #B5935A;
    --text-main:   #2E2620;
    --text-hint:   #A89E94;
    --white:       #FFFFFF;
    --radius-sm:   6px;
    --radius-md:   10px;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: 'Inter', sans-serif;
    background: var(--cream-bg);
    color: var(--text-main);
    height: 100vh;
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }

  header {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 0 20px;
    height: 52px;
    background: var(--cream-light);
    border-bottom: 1px solid var(--cream-border);
    flex-shrink: 0;
  }

  .logo {
    display: flex;
    align-items: center;
    gap: 8px;
    font-size: 14px;
    font-weight: 600;
    color: var(--brown-dark);
    letter-spacing: -0.01em;
  }
  .logo-icon {
    width: 28px; height: 28px;
    background: var(--brown-btn);
    border-radius: 7px;
    display: flex; align-items: center; justify-content: center;
    color: var(--cream-light);
    font-size: 14px;
  }

  .spacer { flex: 1; }
  .toolbar-btns { display: flex; gap: 8px; }

  .btn {
    display: inline-flex; align-items: center; gap: 5px;
    padding: 6px 13px;
    border-radius: var(--radius-sm);
    font-size: 12.5px; font-weight: 500;
    font-family: 'Inter', sans-serif;
    cursor: pointer; border: none;
    transition: all 0.15s;
  }
  .btn-clear {
    background: transparent;
    color: var(--text-hint);
    border: 1px solid var(--cream-border);
  }
  .btn-clear:hover { background: #f5ece4; color: #b05a3a; border-color: #e0c0a8; }

  .btn-capture {
    background: var(--brown-btn);
    color: var(--cream-light);
    border: 1px solid transparent;
    padding: 6px 16px;
  }
  .btn-capture:hover { background: var(--brown-hover); }
  .btn-capture:active { transform: scale(0.97); }
  .btn-capture:disabled { opacity: 0.6; cursor: not-allowed; }

  .main { display: flex; flex: 1; min-height: 0; }

  .editor-panel {
    display: flex;
    flex-direction: column;
    width: 340px;
    flex-shrink: 0;
    border-right: 1px solid var(--cream-border);
    background: var(--cream-light);
  }

  .panel-header {
    display: flex; align-items: center; justify-content: space-between;
    padding: 8px 14px;
    border-bottom: 1px solid var(--cream-border);
    background: var(--cream-bg);
  }
  .panel-label {
    font-size: 10.5px; font-weight: 600;
    color: var(--text-hint);
    letter-spacing: 0.07em; text-transform: uppercase;
  }
  .line-count {
    font-size: 11px; color: var(--text-hint);
    font-family: 'JetBrains Mono', monospace;
  }

  textarea {
    flex: 1;
    width: 100%; resize: none;
    border: none; outline: none;
    padding: 16px 14px;
    font-size: 12.5px; line-height: 1.7;
    font-family: 'JetBrains Mono', monospace;
    background: var(--cream-light);
    color: var(--text-main);
    caret-color: var(--accent);
    tab-size: 2;
  }
  textarea::placeholder { color: var(--text-hint); font-size: 12px; }
  textarea:focus { background: var(--white); }

  .resize-handle {
    width: 5px;
    background: var(--cream-border);
    cursor: col-resize;
    flex-shrink: 0;
    transition: background 0.15s;
  }
  .resize-handle:hover { background: var(--accent); }

  .preview-panel {
    display: flex;
    flex-direction: column;
    flex: 1;
    min-width: 0;
    background: var(--cream-bg);
  }

  .preview-body {
    flex: 1; min-height: 0; position: relative;
    background: #fff;
    margin: 12px;
    border-radius: var(--radius-md);
    overflow: hidden;
    border: 1px solid var(--cream-border);
    box-shadow: 0 2px 12px rgba(74,63,50,0.06);
  }

  iframe {
    width: 100%; height: 100%;
    border: none; display: block;
  }

  .empty-state {
    position: absolute; inset: 0;
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    gap: 10px;
    background: var(--cream-light);
    pointer-events: none;
  }
  .empty-icon { font-size: 36px; opacity: 0.3; }
  .empty-text { font-size: 13px; color: var(--text-hint); }

  .toast {
    position: fixed;
    bottom: 28px; left: 50%;
    transform: translateX(-50%) translateY(20px);
    background: var(--brown-dark);
    color: var(--cream-light);
    padding: 10px 22px;
    border-radius: 30px;
    font-size: 13px; font-weight: 500;
    opacity: 0;
    transition: all 0.25s ease;
    pointer-events: none;
    z-index: 100;
    white-space: nowrap;
  }
  .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
</style>
</head>
<body>

<header>
  <div class="logo">
    <div class="logo-icon">&#60;/&#62;</div>
    HTML 미리보기
    <span style="font-size:10px;font-weight:400;color:var(--text-hint);margin-left:4px;">v7</span>
  </div>
  <div class="spacer"></div>
  <div class="toolbar-btns">
    <button class="btn btn-clear" id="clearBtn">초기화</button>
    <button class="btn btn-capture" id="captureBtn">📷 캡처 저장</button>
  </div>
</header>

<div class="main">
  <div class="editor-panel" id="editorPanel">
    <div class="panel-header">
      <span class="panel-label">코드 편집</span>
      <span class="line-count" id="lineCount">0줄</span>
    </div>
    <textarea id="codeEditor" placeholder="여기에 HTML 코드를 입력하세요..." spellcheck="false"></textarea>
  </div>

  <div class="resize-handle" id="resizeHandle"></div>

  <div class="preview-panel">
    <div class="preview-body" id="previewBody">
      <div class="empty-state" id="emptyState">
        <div class="empty-icon">⌨️</div>
        <div class="empty-text">왼쪽에 HTML 코드를 입력하면 여기에 표시됩니다</div>
      </div>
      <iframe id="previewFrame" sandbox="allow-scripts allow-same-origin" style="display:none;"></iframe>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
const editor     = document.getElementById('codeEditor');
const frame      = document.getElementById('previewFrame');
const lineCount  = document.getElementById('lineCount');
const emptyState = document.getElementById('emptyState');
const toast      = document.getElementById('toast');
const captureBtn = document.getElementById('captureBtn');

let timer;
let currentCode = '';

function updatePreview() {
  currentCode = editor.value.trim();
  lineCount.textContent = (editor.value ? editor.value.split('\n').length : 0) + '줄';
  clearTimeout(timer);
  timer = setTimeout(() => {
    if (!currentCode) {
      frame.style.display = 'none';
      emptyState.style.display = 'flex';
      return;
    }
    const doc = frame.contentDocument || frame.contentWindow.document;
    doc.open(); doc.write(currentCode); doc.close();
    frame.style.display = 'block';
    emptyState.style.display = 'none';
  }, 280);
}

editor.addEventListener('input', updatePreview);

editor.addEventListener('keydown', e => {
  if (e.key === 'Tab') {
    e.preventDefault();
    const s = editor.selectionStart;
    editor.value = editor.value.slice(0, s) + '  ' + editor.value.slice(editor.selectionEnd);
    editor.selectionStart = editor.selectionEnd = s + 2;
    updatePreview();
  }
});

document.getElementById('clearBtn').addEventListener('click', () => {
  editor.value = '';
  updatePreview();
  editor.focus();
});

// ── 캡처 ──
// 핵심 전략: 캡처 전용 iframe을 만들고 그 안에 html2canvas를 주입.
// 단, iframe 너비를 콘텐츠의 max-width에 맞게 설정한 뒤
// html2canvas의 onclone 콜백에서 정확한 scrollHeight를 재측정해 딱 맞게 자름.
captureBtn.addEventListener('click', () => {
  if (!currentCode) { showToast('먼저 HTML 코드를 입력하세요'); return; }

  captureBtn.disabled = true;
  captureBtn.textContent = '캡처 중...';

  const h2cUrl = 'https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js';

  // 캡처 전용 iframe — 너비를 800px로 고정해서 콘텐츠 너비 기준으로 렌더링
  const captureFrame = document.createElement('iframe');
  captureFrame.setAttribute('sandbox', 'allow-scripts allow-same-origin');
  captureFrame.style.cssText = 'position:fixed;left:-99999px;top:0;width:800px;height:3000px;border:none;visibility:hidden;';
  document.body.appendChild(captureFrame);

  // 유저 코드 끝에 캡처 스크립트 주입
  // </body> 가 없는 코드도 처리
  const tag = currentCode.toLowerCase().includes('</body>') ? '</body>' : null;

  const captureScript = `
<script src="${h2cUrl}"><\/script>
<script>
window.addEventListener('load', function() {
  // 마진/패딩 제거
  document.documentElement.style.margin = '0';
  document.documentElement.style.padding = '0';
  document.body.style.margin = '0';
  document.body.style.padding = '0';

  // 콘텐츠 자식들의 실제 bounding rect로 정확한 크기 측정
  var allEls = document.body.querySelectorAll('*');
  var maxRight = 0, maxBottom = 0;
  for (var i = 0; i < allEls.length; i++) {
    var r = allEls[i].getBoundingClientRect();
    if (r.right  > maxRight)  maxRight  = r.right;
    if (r.bottom > maxBottom) maxBottom = r.bottom;
  }
  // body 자체 rect도 포함
  var bodyRect = document.body.getBoundingClientRect();
  var W = Math.max(maxRight,  bodyRect.width,  document.body.offsetWidth);
  var H = Math.max(maxBottom, bodyRect.height, document.body.offsetHeight, document.body.scrollHeight);

  html2canvas(document.body, {
    width:        W,
    height:       H,
    windowWidth:  W,
    windowHeight: H,
    x:            0,
    y:            0,
    scrollX:      0,
    scrollY:      0,
    useCORS:      true,
    allowTaint:   true,
    scale:        2,
    onclone: function(cloned) {
      cloned.documentElement.style.margin  = '0';
      cloned.documentElement.style.padding = '0';
      cloned.body.style.margin  = '0';
      cloned.body.style.padding = '0';
      cloned.body.style.width   = W + 'px';
    }
  }).then(function(canvas) {
    window.parent.postMessage({ type: 'CAPTURE_DONE', dataUrl: canvas.toDataURL('image/png') }, '*');
  }).catch(function(err) {
    window.parent.postMessage({ type: 'CAPTURE_ERROR', msg: String(err) }, '*');
  });
});
<\/script>`;

  const injected = tag
    ? currentCode.replace(/<\/body>/i, captureScript + '</body>')
    : currentCode + captureScript;

  function onMessage(e) {
    if (!e.data || (e.data.type !== 'CAPTURE_DONE' && e.data.type !== 'CAPTURE_ERROR')) return;
    window.removeEventListener('message', onMessage);
    if (document.body.contains(captureFrame)) document.body.removeChild(captureFrame);
    captureBtn.disabled = false;
    captureBtn.textContent = '📷 캡처 저장';

    if (e.data.type === 'CAPTURE_DONE') {
      const a  = document.createElement('a');
      const ts = new Date().toISOString().slice(0,19).replace(/[T:]/g,'-');
      a.download = 'preview-' + ts + '.png';
      a.href = e.data.dataUrl;
      a.click();
      showToast('✓ 저장되었습니다');
    } else {
      showToast('캡처 실패: ' + e.data.msg);
    }
  }
  window.addEventListener('message', onMessage);

  const cDoc = captureFrame.contentDocument || captureFrame.contentWindow.document;
  cDoc.open(); cDoc.write(injected); cDoc.close();

  setTimeout(() => {
    if (captureBtn.disabled) {
      window.removeEventListener('message', onMessage);
      if (document.body.contains(captureFrame)) document.body.removeChild(captureFrame);
      showToast('캡처 시간 초과');
      captureBtn.disabled = false;
      captureBtn.textContent = '📷 캡처 저장';
    }
  }, 30000);
});

function showToast(msg) {
  toast.textContent = msg;
  toast.classList.add('show');
  setTimeout(() => toast.classList.remove('show'), 2400);
}

// ── 패널 드래그 리사이즈 ──
const handle = document.getElementById('resizeHandle');
const editorPanel = document.getElementById('editorPanel');
let dragging = false, startX, startW;

handle.addEventListener('mousedown', e => {
  dragging = true; startX = e.clientX; startW = editorPanel.offsetWidth;
  document.body.style.cursor = 'col-resize';
  document.body.style.userSelect = 'none';
  e.preventDefault();
});
document.addEventListener('mousemove', e => {
  if (!dragging) return;
  const w = Math.max(200, Math.min(700, startW + (e.clientX - startX)));
  editorPanel.style.width = w + 'px';
});
document.addEventListener('mouseup', () => {
  dragging = false;
  document.body.style.cursor = '';
  document.body.style.userSelect = '';
});
</script>
</body>
</html>
