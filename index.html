<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>HTML 미리보기 v4</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=JetBrains+Mono:wght@400;500&display=swap');

  :root {
    --cream-bg:    #F7F3EC;
    --cream-light: #FBF8F3;
    --cream-dark:  #EDE8DE;
    --cream-border:#DDD8CE;
    --brown-dark:  #4A3F32;
    --brown-btn:   #6B5A47;
    --brown-hover: #584A3A;
    --accent:      #B5935A;
    --text-main:   #2E2620;
    --text-hint:   #A89E94;
    --white:       #FFFFFF;
    --radius-sm:   6px;
    --radius-md:   10px;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: 'Inter', sans-serif;
    background: var(--cream-bg);
    color: var(--text-main);
    height: 100vh;
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }

  header {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 0 20px;
    height: 52px;
    background: var(--cream-light);
    border-bottom: 1px solid var(--cream-border);
    flex-shrink: 0;
  }

  .logo {
    display: flex;
    align-items: center;
    gap: 8px;
    font-size: 14px;
    font-weight: 600;
    color: var(--brown-dark);
    letter-spacing: -0.01em;
  }
  .logo-icon {
    width: 28px; height: 28px;
    background: var(--brown-btn);
    border-radius: 7px;
    display: flex; align-items: center; justify-content: center;
    color: var(--cream-light);
    font-size: 14px;
  }

  .spacer { flex: 1; }
  .toolbar-btns { display: flex; gap: 8px; }

  .btn {
    display: inline-flex; align-items: center; gap: 5px;
    padding: 6px 13px;
    border-radius: var(--radius-sm);
    font-size: 12.5px; font-weight: 500;
    font-family: 'Inter', sans-serif;
    cursor: pointer; border: none;
    transition: all 0.15s;
  }
  .btn-clear {
    background: transparent;
    color: var(--text-hint);
    border: 1px solid var(--cream-border);
  }
  .btn-clear:hover { background: #f5ece4; color: #b05a3a; border-color: #e0c0a8; }

  .btn-capture {
    background: var(--brown-btn);
    color: var(--cream-light);
    border: 1px solid transparent;
    padding: 6px 16px;
  }
  .btn-capture:hover { background: var(--brown-hover); }
  .btn-capture:active { transform: scale(0.97); }
  .btn-capture:disabled { opacity: 0.6; cursor: not-allowed; }

  .main { display: flex; flex: 1; min-height: 0; }

  .editor-panel {
    display: flex;
    flex-direction: column;
    width: 340px;
    flex-shrink: 0;
    border-right: 1px solid var(--cream-border);
    background: var(--cream-light);
  }

  .panel-header {
    display: flex; align-items: center; justify-content: space-between;
    padding: 8px 14px;
    border-bottom: 1px solid var(--cream-border);
    background: var(--cream-bg);
  }
  .panel-label {
    font-size: 10.5px; font-weight: 600;
    color: var(--text-hint);
    letter-spacing: 0.07em; text-transform: uppercase;
  }
  .line-count {
    font-size: 11px; color: var(--text-hint);
    font-family: 'JetBrains Mono', monospace;
  }

  textarea {
    flex: 1;
    width: 100%; resize: none;
    border: none; outline: none;
    padding: 16px 14px;
    font-size: 12.5px; line-height: 1.7;
    font-family: 'JetBrains Mono', monospace;
    background: var(--cream-light);
    color: var(--text-main);
    caret-color: var(--accent);
    tab-size: 2;
  }
  textarea::placeholder { color: var(--text-hint); font-size: 12px; }
  textarea:focus { background: var(--white); }

  .resize-handle {
    width: 5px;
    background: var(--cream-border);
    cursor: col-resize;
    flex-shrink: 0;
    transition: background 0.15s;
  }
  .resize-handle:hover { background: var(--accent); }

  .preview-panel {
    display: flex;
    flex-direction: column;
    flex: 1;
    min-width: 0;
    background: var(--cream-bg);
  }

  .preview-body {
    flex: 1; min-height: 0; position: relative;
    background: #fff;
    margin: 12px;
    border-radius: var(--radius-md);
    overflow: hidden;
    border: 1px solid var(--cream-border);
    box-shadow: 0 2px 12px rgba(74,63,50,0.06);
  }

  iframe {
    width: 100%; height: 100%;
    border: none; display: block;
  }

  .empty-state {
    position: absolute; inset: 0;
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    gap: 10px;
    background: var(--cream-light);
    pointer-events: none;
  }
  .empty-icon { font-size: 36px; opacity: 0.3; }
  .empty-text { font-size: 13px; color: var(--text-hint); }

  .toast {
    position: fixed;
    bottom: 28px; left: 50%;
    transform: translateX(-50%) translateY(20px);
    background: var(--brown-dark);
    color: var(--cream-light);
    padding: 10px 22px;
    border-radius: 30px;
    font-size: 13px; font-weight: 500;
    opacity: 0;
    transition: all 0.25s ease;
    pointer-events: none;
    z-index: 100;
    white-space: nowrap;
  }
  .toast.show {
    opacity: 1;
    transform: translateX(-50%) translateY(0);
  }
</style>
</head>
<body>

<header>
  <div class="logo">
    <div class="logo-icon">&#60;/&#62;</div>
    HTML 미리보기
    <span style="font-size:10px;font-weight:400;color:var(--text-hint);margin-left:4px;">v4</span>
  </div>
  <div class="spacer"></div>
  <div class="toolbar-btns">
    <button class="btn btn-clear" id="clearBtn">초기화</button>
    <button class="btn btn-capture" id="captureBtn">📷 캡처 저장</button>
  </div>
</header>

<div class="main">
  <div class="editor-panel" id="editorPanel">
    <div class="panel-header">
      <span class="panel-label">코드 편집</span>
      <span class="line-count" id="lineCount">0줄</span>
    </div>
    <textarea id="codeEditor" placeholder="여기에 HTML 코드를 입력하세요..." spellcheck="false"></textarea>
  </div>

  <div class="resize-handle" id="resizeHandle"></div>

  <div class="preview-panel">
    <div class="preview-body" id="previewBody">
      <div class="empty-state" id="emptyState">
        <div class="empty-icon">⌨️</div>
        <div class="empty-text">왼쪽에 HTML 코드를 입력하면 여기에 표시됩니다</div>
      </div>
      <iframe id="previewFrame" sandbox="allow-scripts allow-same-origin" style="display:none;"></iframe>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
const editor     = document.getElementById('codeEditor');
const frame      = document.getElementById('previewFrame');
const lineCount  = document.getElementById('lineCount');
const emptyState = document.getElementById('emptyState');
const toast      = document.getElementById('toast');
const captureBtn = document.getElementById('captureBtn');

let timer;

function updatePreview() {
  const code = editor.value.trim();
  lineCount.textContent = (editor.value ? editor.value.split('\n').length : 0) + '줄';
  clearTimeout(timer);
  timer = setTimeout(() => {
    if (!code) {
      frame.style.display = 'none';
      emptyState.style.display = 'flex';
      return;
    }
    const doc = frame.contentDocument || frame.contentWindow.document;
    doc.open(); doc.write(code); doc.close();
    frame.style.display = 'block';
    emptyState.style.display = 'none';
  }, 280);
}

editor.addEventListener('input', updatePreview);

editor.addEventListener('keydown', e => {
  if (e.key === 'Tab') {
    e.preventDefault();
    const s = editor.selectionStart;
    editor.value = editor.value.slice(0, s) + '  ' + editor.value.slice(editor.selectionEnd);
    editor.selectionStart = editor.selectionEnd = s + 2;
    updatePreview();
  }
});

document.getElementById('clearBtn').addEventListener('click', () => {
  editor.value = '';
  updatePreview();
  editor.focus();
});

// ── 캡처: dom-to-image-more 라이브러리 사용 ──
captureBtn.addEventListener('click', async () => {
  const code = editor.value.trim();
  if (!code) { showToast('먼저 HTML 코드를 입력하세요'); return; }

  captureBtn.disabled = true;
  captureBtn.textContent = '캡처 중...';

  try {
    const iDoc  = frame.contentDocument || frame.contentWindow.document;
    const iBody = iDoc.body;
    const iHtml = iDoc.documentElement;

    // 콘텐츠 실제 크기
    const W = Math.max(iBody.scrollWidth,  iHtml.scrollWidth,  iBody.offsetWidth,  iHtml.offsetWidth);
    const H = Math.max(iBody.scrollHeight, iHtml.scrollHeight, iBody.offsetHeight, iHtml.offsetHeight);

    // iframe을 콘텐츠 크기로 임시 확장 (여백 제거 핵심)
    frame.style.width  = W + 'px';
    frame.style.height = H + 'px';

    // domtoimage로 캡처
    const dataUrl = await domtoimage.toPng(iHtml, {
      width: W,
      height: H,
      style: { margin: '0', padding: '0' }
    });

    // iframe 원래 크기 복원
    frame.style.width  = '100%';
    frame.style.height = '100%';

    const a  = document.createElement('a');
    const ts = new Date().toISOString().slice(0,19).replace(/[T:]/g,'-');
    a.download = 'preview-' + ts + '.png';
    a.href = dataUrl;
    a.click();
    showToast('✓ 저장되었습니다');
  } catch (err) {
    frame.style.width  = '100%';
    frame.style.height = '100%';
    console.error(err);
    showToast('캡처 실패: ' + err.message);
  }

  captureBtn.disabled = false;
  captureBtn.textContent = '📷 캡처 저장';
});

function showToast(msg) {
  toast.textContent = msg;
  toast.classList.add('show');
  setTimeout(() => toast.classList.remove('show'), 2400);
}

// ── 패널 드래그 리사이즈 ──
const handle = document.getElementById('resizeHandle');
const editorPanel = document.getElementById('editorPanel');
let dragging = false, startX, startW;

handle.addEventListener('mousedown', e => {
  dragging = true; startX = e.clientX; startW = editorPanel.offsetWidth;
  document.body.style.cursor = 'col-resize';
  document.body.style.userSelect = 'none';
  e.preventDefault();
});
document.addEventListener('mousemove', e => {
  if (!dragging) return;
  const w = Math.max(200, Math.min(700, startW + (e.clientX - startX)));
  editorPanel.style.width = w + 'px';
});
document.addEventListener('mouseup', () => {
  dragging = false;
  document.body.style.cursor = '';
  document.body.style.userSelect = '';
});
</script>

<!-- dom-to-image-more: SVG foreignObject보다 훨씬 안정적 -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/dom-to-image-more/3.3.0/dom-to-image-more.min.js"></script>

</body>
</html>
