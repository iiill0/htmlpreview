<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>HTML 미리보기 v23</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=JetBrains+Mono:wght@400;500&display=swap');

  :root {
    --cream-bg:    #F7F3EC;
    --cream-light: #FBF8F3;
    --cream-border:#DDD8CE;
    --brown-dark:  #4A3F32;
    --brown-btn:   #6B5A47;
    --brown-hover: #584A3A;
    --accent:      #B5935A;
    --text-main:   #2E2620;
    --text-hint:   #A89E94;
    --radius-sm:   6px;
    --radius-md:   10px;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: 'Inter', sans-serif;
    background: var(--cream-bg);
    color: var(--text-main);
    height: 100dvh;
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }

  /* ── 헤더 ── */
  header {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 0 16px;
    height: 50px;
    background: var(--cream-light);
    border-bottom: 1px solid var(--cream-border);
    flex-shrink: 0;
  }
  .logo {
    display: flex;
    align-items: center;
    gap: 8px;
    font-size: 14px;
    font-weight: 600;
    color: var(--brown-dark);
    white-space: nowrap;
  }
  .logo-icon {
    width: 28px; height: 28px;
    background: var(--brown-btn);
    border-radius: 7px;
    display: flex; align-items: center; justify-content: center;
    color: #FBF8F3;
    font-size: 13px;
    flex-shrink: 0;
  }
  .spacer { flex: 1; }

  .btn {
    display: inline-flex; align-items: center; gap: 5px;
    padding: 6px 14px;
    border-radius: var(--radius-sm);
    font-size: 12.5px; font-weight: 500;
    font-family: 'Inter', sans-serif;
    cursor: pointer; border: none;
    transition: all 0.15s;
    white-space: nowrap;
  }
  .btn-clear {
    background: transparent;
    color: var(--text-hint);
    border: 1px solid var(--cream-border);
  }
  .btn-clear:hover { background: #f5ece4; color: #b05a3a; }
  .btn-capture {
    background: var(--brown-btn);
    color: #FBF8F3;
  }
  .btn-capture:hover { background: var(--brown-hover); }
  .btn-capture:disabled { opacity: 0.5; cursor: not-allowed; }

  /* ── 모바일 탭 ── */
  .tab-bar {
    display: none;
    background: var(--cream-light);
    border-bottom: 1px solid var(--cream-border);
    flex-shrink: 0;
  }
  .tab-bar-inner { display: flex; }
  .tab-btn {
    flex: 1; padding: 10px 0;
    background: none; border: none;
    border-bottom: 2px solid transparent;
    font-family: 'Inter', sans-serif;
    font-size: 13px; font-weight: 500;
    color: var(--text-hint);
    cursor: pointer; transition: all 0.15s;
  }
  .tab-btn.active { color: var(--brown-btn); border-bottom-color: var(--brown-btn); }

  /* ── 메인 ── */
  .main { display: flex; flex: 1; min-height: 0; }

  /* ── 에디터 ── */
  .editor-panel {
    display: flex; flex-direction: column;
    width: 260px; flex-shrink: 0;
    border-right: 1px solid var(--cream-border);
    background: var(--cream-light);
  }
  .panel-header {
    display: flex; align-items: center; justify-content: space-between;
    padding: 7px 12px;
    border-bottom: 1px solid var(--cream-border);
    background: var(--cream-bg);
    flex-shrink: 0;
  }
  .panel-label {
    font-size: 10px; font-weight: 600;
    color: var(--text-hint);
    letter-spacing: 0.07em; text-transform: uppercase;
  }
  .line-count { font-size: 11px; color: var(--text-hint); font-family: 'JetBrains Mono', monospace; }

  textarea {
    flex: 1; width: 100%; resize: none;
    border: none; outline: none;
    padding: 14px 12px;
    font-size: 12px; line-height: 1.7;
    font-family: 'JetBrains Mono', monospace;
    background: var(--cream-light);
    color: var(--text-main);
    tab-size: 2;
  }
  textarea:focus { background: #fff; }
  textarea::placeholder { color: var(--text-hint); }

  /* ── 드래그 핸들 ── */
  .resize-handle {
    width: 4px; flex-shrink: 0;
    background: var(--cream-border);
    cursor: col-resize;
    transition: background 0.15s;
  }
  .resize-handle:hover { background: var(--accent); }

  /* ── 미리보기 ── */
  .preview-panel {
    display: flex; flex-direction: column;
    flex: 1; min-width: 0;
  }

  /* 미리보기 박스: 세로 스크롤만 허용 */
  .preview-body {
    flex: 1; min-height: 0;
    margin: 10px;
    border-radius: var(--radius-md);
    border: 1px solid var(--cream-border);
    box-shadow: 0 2px 12px rgba(74,63,50,0.06);
    background: #fff;
    overflow-x: hidden;
    overflow-y: auto;
    position: relative;
  }

  /* iframe: 너비 100%, 높이는 JS로 콘텐츠에 맞게 */
  #previewFrame {
    display: none;
    width: 100%;
    border: none;
    background: #fff;
  }

  .empty-state {
    position: absolute; inset: 0;
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    gap: 10px;
    background: var(--cream-light);
    pointer-events: none;
  }
  .empty-icon { font-size: 34px; opacity: 0.3; }
  .empty-text { font-size: 13px; color: var(--text-hint); }

  /* ── 토스트 ── */
  .toast {
    position: fixed; bottom: 28px; left: 50%;
    transform: translateX(-50%) translateY(20px);
    background: var(--brown-dark); color: #FBF8F3;
    padding: 10px 22px; border-radius: 30px;
    font-size: 13px; font-weight: 500;
    opacity: 0; transition: all 0.25s ease;
    pointer-events: none; z-index: 100;
    white-space: nowrap;
  }
  .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

  /* ── 모바일 ── */
  @media (max-width: 768px) {
    .logo .ver { display: none; }
    .tab-bar { display: block; }
    .resize-handle { display: none; }
    .main { flex-direction: column; }

    .editor-panel {
      width: 100%; border-right: none;
      flex: 1; min-height: 0;
      display: none;
    }
    .editor-panel.tab-active { display: flex; }

    .preview-panel { flex: 1; min-height: 0; display: none; }
    .preview-panel.tab-active { display: flex; }

    .preview-body { margin: 8px; }
    .panel-header { display: none; }
    .btn { padding: 5px 10px; font-size: 12px; }
  }
</style>
</head>
<body>

<header>
  <div class="logo">
    <div class="logo-icon">&#60;/&#62;</div>
    HTML 미리보기
    <span class="ver" style="font-size:10px;font-weight:400;color:var(--text-hint);margin-left:2px;">v23</span>
  </div>
  <div class="spacer"></div>
  <button class="btn btn-clear" id="clearBtn">초기화</button>
  <button class="btn btn-capture" id="captureBtn">📷 캡처</button>
</header>

<div class="tab-bar">
  <div class="tab-bar-inner">
    <button class="tab-btn active" id="tabCode" onclick="switchTab('code')">✏️ 코드</button>
    <button class="tab-btn" id="tabPreview" onclick="switchTab('preview')">👁 미리보기</button>
  </div>
</div>

<div class="main">
  <div class="editor-panel tab-active" id="editorPanel">
    <div class="panel-header">
      <span class="panel-label">코드 편집</span>
      <span class="line-count" id="lineCount">0줄</span>
    </div>
    <textarea id="codeEditor" placeholder="여기에 HTML 코드를 입력하세요..." spellcheck="false"></textarea>
  </div>

  <div class="resize-handle" id="resizeHandle"></div>

  <div class="preview-panel tab-active" id="previewPanel">
    <div class="preview-body" id="previewBody">
      <div class="empty-state" id="emptyState">
        <div class="empty-icon">⌨️</div>
        <div class="empty-text">HTML 코드를 입력하면 여기에 표시됩니다</div>
      </div>
      <iframe id="previewFrame" sandbox="allow-scripts allow-same-origin"></iframe>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
const editor      = document.getElementById('codeEditor');
const frame       = document.getElementById('previewFrame');
const previewBody = document.getElementById('previewBody');
const lineCount   = document.getElementById('lineCount');
const emptyState  = document.getElementById('emptyState');
const captureBtn  = document.getElementById('captureBtn');
const toast       = document.getElementById('toast');

let timer;
let currentCode = '';

// iframe 높이를 콘텐츠에 맞게 조정
function fitIframeHeight() {
  try {
    const h = frame.contentDocument.documentElement.scrollHeight;
    if (h > 0) frame.style.height = h + 'px';
  } catch(e) {}
}

function updatePreview() {
  currentCode = editor.value.trim();
  lineCount.textContent = (editor.value ? editor.value.split('\n').length : 0) + '줄';
  clearTimeout(timer);
  timer = setTimeout(() => {
    if (!currentCode) {
      frame.style.display = 'none';
      frame.style.height = '0px';
      emptyState.style.display = 'flex';
      return;
    }
    // 매번 새로 작성
    frame.style.height = '0px';
    const doc = frame.contentDocument || frame.contentWindow.document;
    doc.open();
    doc.write(currentCode);
    doc.close();
    frame.style.display = 'block';
    emptyState.style.display = 'none';
    // 렌더링 후 높이 맞춤
    setTimeout(fitIframeHeight, 200);
    if (window.innerWidth <= 768) switchTab('preview');
  }, 400);
}

editor.addEventListener('input', updatePreview);
editor.addEventListener('keydown', e => {
  if (e.key === 'Tab') {
    e.preventDefault();
    const s = editor.selectionStart;
    editor.value = editor.value.slice(0, s) + '  ' + editor.value.slice(editor.selectionEnd);
    editor.selectionStart = editor.selectionEnd = s + 2;
    updatePreview();
  }
});

document.getElementById('clearBtn').addEventListener('click', () => {
  editor.value = '';
  currentCode = '';
  frame.style.display = 'none';
  frame.style.height = '0px';
  emptyState.style.display = 'flex';
  lineCount.textContent = '0줄';
  if (window.innerWidth <= 768) switchTab('code');
  editor.focus();
});

// ── 탭 전환 ──
function switchTab(tab) {
  const ep = document.getElementById('editorPanel');
  const pp = document.getElementById('previewPanel');
  const tc = document.getElementById('tabCode');
  const tp = document.getElementById('tabPreview');
  if (tab === 'code') {
    ep.classList.add('tab-active'); pp.classList.remove('tab-active');
    tc.classList.add('active');     tp.classList.remove('active');
    setTimeout(() => editor.focus(), 50);
  } else {
    pp.classList.add('tab-active'); ep.classList.remove('tab-active');
    tp.classList.add('active');     tc.classList.remove('active');
    setTimeout(fitIframeHeight, 50);
  }
}

// ── 캡처 ──
// 별도 iframe에 html2canvas 주입 → postMessage로 결과 수신
captureBtn.addEventListener('click', () => {
  if (!currentCode) { showToast('먼저 HTML 코드를 입력하세요'); return; }
  captureBtn.disabled = true;
  captureBtn.textContent = '캡처 중...';

  const h2cUrl = 'https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js';
  const cf = document.createElement('iframe');
  cf.setAttribute('sandbox', 'allow-scripts allow-same-origin');
  cf.style.cssText = 'position:fixed;left:-99999px;top:0;width:800px;height:10000px;border:none;visibility:hidden;';
  document.body.appendChild(cf);

  const hasBody = /<\/body>/i.test(currentCode);
  const script = `<script src="${h2cUrl}"><\/script><script>
window.addEventListener('load',function(){
 var start=function(){
  var els=document.body.querySelectorAll('*'),maxR=0,maxB=0;
  for(var i=0;i<els.length;i++){
    var el=els[i];
    if(el.offsetParent===null&&el.tagName!=='BODY')continue;
    var r=el.getBoundingClientRect();
    if(r.width===0&&r.height===0)continue;
    if(r.right>maxR)maxR=r.right;
    if(r.bottom>maxB)maxB=r.bottom;
  }
  var pb=parseFloat(getComputedStyle(document.body).paddingBottom)||0;
  var W=Math.max(maxR,document.body.offsetWidth);
  var H=maxB+pb;
  html2canvas(document.body,{
    width:W,height:H,windowWidth:W,windowHeight:H,
    x:0,y:0,scrollX:0,scrollY:0,
    useCORS:true,allowTaint:true,scale:2,
    backgroundColor:null,
    logging:false,
    imageTimeout:0,
    removeContainer:true
  }).then(function(canvas){
    window.parent.postMessage({type:'CAPTURE_DONE',dataUrl:canvas.toDataURL('image/png')},'*');
  }).catch(function(e){
    window.parent.postMessage({type:'CAPTURE_ERROR',msg:String(e)},'*');
  });
 };
 if(document.fonts&&document.fonts.ready){document.fonts.ready.then(function(){setTimeout(start,1500);});}
 else{setTimeout(start,1500);}
});
<\/script>`;

  const injected = hasBody
    ? currentCode.replace(/<\/body>/i, script + '</body>')
    : currentCode + script;

  function onMsg(e) {
    if (!e.data || (e.data.type !== 'CAPTURE_DONE' && e.data.type !== 'CAPTURE_ERROR')) return;
    window.removeEventListener('message', onMsg);
    if (document.body.contains(cf)) document.body.removeChild(cf);
    captureBtn.disabled = false;
    captureBtn.textContent = '📷 캡처';
    if (e.data.type === 'CAPTURE_DONE') {
      const a = document.createElement('a');
      const ts = new Date().toISOString().slice(0,19).replace(/[T:]/g,'-');
      a.download = 'preview-' + ts + '.png';
      a.href = e.data.dataUrl;
      a.click();
      showToast('✓ 저장되었습니다');
    } else {
      showToast('캡처 실패: ' + e.data.msg);
    }
  }
  window.addEventListener('message', onMsg);

  const cd = cf.contentDocument || cf.contentWindow.document;
  cd.open(); cd.write(injected); cd.close();

  setTimeout(() => {
    if (captureBtn.disabled) {
      window.removeEventListener('message', onMsg);
      if (document.body.contains(cf)) document.body.removeChild(cf);
      showToast('캡처 시간 초과');
      captureBtn.disabled = false;
      captureBtn.textContent = '📷 캡처';
    }
  }, 30000);
});

function showToast(msg) {
  toast.textContent = msg;
  toast.classList.add('show');
  setTimeout(() => toast.classList.remove('show'), 2400);
}

// ── 드래그 리사이즈 ──
const handle = document.getElementById('resizeHandle');
const editorPanel = document.getElementById('editorPanel');
let drag = false, startX, startW;
handle.addEventListener('mousedown', e => {
  drag = true; startX = e.clientX; startW = editorPanel.offsetWidth;
  document.body.style.cursor = 'col-resize';
  document.body.style.userSelect = 'none';
  e.preventDefault();
});
document.addEventListener('mousemove', e => {
  if (!drag) return;
  editorPanel.style.width = Math.max(160, Math.min(600, startW + e.clientX - startX)) + 'px';
});
document.addEventListener('mouseup', () => {
  drag = false;
  document.body.style.cursor = '';
  document.body.style.userSelect = '';
});

window.addEventListener('resize', () => {
  if (window.innerWidth > 768) {
    document.getElementById('editorPanel').classList.add('tab-active');
    document.getElementById('previewPanel').classList.add('tab-active');
  }
});
</script>
</body>
</html>
